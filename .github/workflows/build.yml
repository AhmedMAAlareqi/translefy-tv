name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Show files
        run: find . -path ./.git -prune -o -type f -print

      - name: Build
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk tv-web.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tv-web-apk
          path: tv-web.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: tv-web.apk
          make_latest: true
