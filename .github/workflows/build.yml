name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk tv-web.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tv-web-apk
          path: tv-web.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: tv-web.apk
          make_latest: true
